<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../images/icon.svg" type="image/svg+xml">
        <link rel="icon" href="../images/favicon.ico" sizes="any">
        <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        >
        <link rel="stylesheet" href="../css/main.css">
        <link rel="stylesheet" href="../css/ContactPage.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="../js/ContactPage.js" defer></script>
        <title>Fernhill | Contact Us</title>
        <link rel="stylesheet" href="../css/navbar.css">
    </head>
    <body>
        <header class="site-nav">
            <div class="wrap nav-inner">
                <a class="nav-logo" href="index.html" aria-label="Go to homepage">
                    <img src="../images/website_logo.png" alt="Fernhill logo">
                </a>
                <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="nav-toggle-icon" aria-hidden="true"></span>
                </button>
                <nav id="primary-nav" class="nav-links" aria-label="Primary">
                    <a href="index.html">Home</a>
                    <a href="properties.html">Properties</a>
                    <a href="AboutUs.html">About Us</a>
                    <a href="ContactPage.html">Contact Us</a>
                </nav>
            </div>
        </header>

        <main class="contact-container">
            <!-- Hero Section -->
            <header class="contact-hero">
                <h1>CONTACT US</h1>
            </header>
            <!-- Main Content Area -->
            <section class="contact-content">
                <div class="contact-col">
                    <div class="form-card flex-container">
                        <h2>GET IN TOUCH</h2>
                        <form class="flex-form" id="contact-form" novalidate>
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" name="name" id="name" required>
                                <span class="error-message" id="name-error"></span>                                
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" name="email" id="email" required>
                                <span class="error-message" id="email-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea name="message" id="message" required></textarea>
                                <span class="error-message" id="message-error"></span>                                
                            </div>
                            <div class="form-group">
                                <button type="submit" class="confirm-button">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="contact-col flex-container">
                    <h2>OUR OFFICE</h2>
                    <address class="office-details">
                        <p id="company-name"><strong>Fernhill Properties</strong></p>
                        <p>124–126 Royal Avenue</p>
                        <p>Belfast</p>
                        <p>BT1 1DL</p>
                        <p>United Kingdom</p>
                        
                        <div class="contact-direct">
                        <p><strong>Phone:</strong> <a href="tel:+442890000000">+44 (0) 28 9000 0000</a></p>
                        <p><strong>Email:</strong> <a href="mailto:info@fernhillproperties.com">info@fernhillproperties.com</a></p>
                        </div>
                    </address>
                </div>
            </section>
        </main>

        <!-- Success Modal -->
        <div id="successModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
            <div class="modal-card">
                <h2>Success!</h2>
                <p>Your message has been received. We’ll get back to you shortly.</p>
                <button type="button" id="closeModalBtn" class="confirm-button">Close</button>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="../js/nav.js"></script>
        <script src="../js/ContactPage.js"></script>
    </body>
</html>
