<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../images/temp-favicon-svg.svg" type="image/svg+xml">
        <link rel="icon" href="../images/temp-favicon-ico.ico" sizes="any">
        <link rel="apple-touch-icon" href="../images/temp-favicon-apple.png">
        <link rel="stylesheet" href="../css/main.css">
        <link rel="stylesheet" href="../css/ContactPage.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="../js/ContactPage.js" defer></script>
        <title>Contact Us</title>
    </head>
    <body>
        <main class="contact-container">
            <header class="contact-hero">CONTACT US</header>
            <section class="contact-content">
                <div class="contact-col">
                    <div class="form-card flex-form">
                        <header>GET IN TOUCH</header>
                        <form class="flex-form" id="contact-form" novalidate>
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" name="name" id="name" required>
                                <span class="error-message" id="name-error"></span>                                
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" name="email" id="email" required>
                                <span class="error-message" id="email-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea name="message" id="message" required></textarea>
                                <span class="error-message" id="message-error"></span>                                
                            </div>
                            <div class="form-group">
                                <button type="submit" class="submit-button">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="contact-col">
                    <header>OUR OFFICE</header>
                    <address class="office-details">
                        <p class="company-name"><strong>(COMPANY NAME)</strong></p>
                        <p>124–126 Royal Avenue</p>
                        <p>Belfast</p>
                        <p>BT1 1DL</p>
                        <p>United Kingdom</p>
                        
                        <div class="contact-direct">
                        <p><strong>Phone:</strong> <a href="tel:+442890000000">+44 (0) 28 9000 0000</a></p>
                        <p><strong>Email:</strong> <a href="mailto:info@belfastpremier.com">info@belfastpremier.com</a></p>
                        </div>
                    </address>
            </section>
            </main>
    </body>
</html>
